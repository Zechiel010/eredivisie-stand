name: Update Eredivisie stand

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-stand:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Actuele stand ophalen
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          curl -s \
            -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" \
            "https://api.football-data.org/v4/competitions/DED/standings" \
            -o standings.json

      - name: Gegevens controleren
        run: |
          if ! grep -q '"standings"' standings.json; then
            echo "Fout: Football-data.org heeft geen geldige stand teruggegeven."
            cat standings.json
            exit 1
          fi

      - name: Tijdstip toevoegen
        run: |
          jq --arg tijd "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '. + {updatedAt: $tijd}' standings.json > standings.tmp
          mv standings.tmp standings.json

      - name: Stand opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add standings.json

          git diff --cached --quiet || \
            git commit -m "Update actuele Eredivisie stand"

          git push
