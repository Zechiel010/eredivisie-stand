<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Herendivisie</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 3px 20px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            color: #111;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .uitleg {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .update {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-bol {
            width: 8px;
            height: 8px;
            background: #20a044;
            border-radius: 50%;
            display: inline-block;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th {
            background: #111;
            color: white;
            padding: 13px 8px;
            font-size: 14px;
        }

        td {
            padding: 13px 8px;
            border-bottom: 1px solid #e1e1e1;
            text-align: center;
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        td:nth-child(2) {
            text-align: left;
            font-weight: bold;
        }

        .club {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .club img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .club-naam {
            font-weight: bold;
        }

        .punten {
            font-weight: bold;
            font-size: 18px;
            white-space: nowrap;
        }

        .correctie {
            color: #008000;
            font-weight: bold;
            font-size: 14px;
        }

        /* Clubkleuren */

        .az {
            border-left: 5px solid #e30613;
        }

        .twente {
            border-left: 5px solid #e30613;
        }

        .feyenoord {
            border-left: 5px solid #111111;
        }

        .psv {
            border-left: 5px solid #e30613;
        }

        .ajax {
            border-left: 5px solid #d2122e;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        .laden {
            text-align: center;
            padding: 35px;
            color: #666;
        }

        .fout {
            text-align: center;
            padding: 35px;
            color: #cc0000;
        }

        /* Mobiele versie */

@media (max-width: 700px) {

    body {
        padding: 5px;
    }

    .container {
        padding: 15px 5px;
        border-radius: 10px;
        width: 100%;
    }

    h1 {
        font-size: 23px;
        margin-bottom: 8px;
    }

    .uitleg {
        font-size: 12px;
        margin-bottom: 15px;
    }

    .update {
        font-size: 11px;
        margin-bottom: 12px;
    }

    .table-wrapper {
        overflow-x: hidden;
    }

    table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
    }

    th {
        padding: 8px 2px;
        font-size: 10px;
    }

    td {
        padding: 8px 2px;
        font-size: 11px;
    }

    /* Kolombreedtes */

    th:nth-child(1),
    td:nth-child(1) {
        width: 6%;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: 28%;
    }

    th:nth-child(3),
    td:nth-child(3),
    th:nth-child(4),
    td:nth-child(4),
    th:nth-child(5),
    td:nth-child(5),
    th:nth-child(6),
    td:nth-child(6) {
        width: 8%;
    }

    th:nth-child(7),
    td:nth-child(7),
    th:nth-child(8),
    td:nth-child(8) {
        width: 9%;
    }

    th:nth-child(9),
    td:nth-child(9) {
        width: 16%;
    }

    .club {
        gap: 3px;
    }

    .club img {
        width: 20px;
        height: 20px;
    }

    .club-naam {
        font-size: 10px;
        white-space: nowrap;
    }

    .punten {
        font-size: 14px;
    }

    .correctie {
        display: block;
        font-size: 9px;
        line-height: 1;
        margin-top: 2px;
    }

    .footer {
        font-size: 10px;
        margin-top: 15px;
    }
}
        @media (max-width: 450px) {

            h1 {
                font-size: 23px;
            }

            .container {
                padding-left: 7px;
                padding-right: 7px;
            }

            th,
            td {
                padding: 9px 4px;
            }

            .club img {
                width: 24px;
                height: 24px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🏆Herendivisie 👔 </h1>

    <div class="uitleg">
        De actuele Eredivisie-stand met onze eigen puntentelling.
    </div>

    <div class="update">
        <span class="status">
            <span class="status-bol"></span>
            <span id="laatstBijgewerkt">
                Stand wordt geladen...
            </span>
        </span>
    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Club</th>
                    <th>G</th>
                    <th>W</th>
                    <th>G</th>
                    <th>V</th>
                    <th>DV</th>
                    <th>DT</th>
                    <th>Punten</th>
                </tr>
            </thead>

            <tbody id="stand">

                <tr>
                    <td colspan="9" class="laden">
                        Actuele stand wordt geladen...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <div class="footer">
        Actuele gegevens van football-data.org
    </div>

</div>


<script>

    /*
     * Onze eigen puntentelling
     */

    const clubs = {

        "PSV": {
            naam: "PSV",
            bonus: 0,
            klasse: "psv"
        },

        "Ajax": {
            naam: "Ajax",
            bonus: 3,
            klasse: "ajax"
        },

        "Feyenoord": {
            naam: "Feyenoord",
            bonus: 3,
            klasse: "feyenoord"
        },

        "AZ": {
            naam: "AZ",
            bonus: 10,
            klasse: "az"
        },

        "FC Twente": {
            naam: "FC Twente",
            bonus: 12,
            klasse: "twente"
        }

    };


    /*
     * De actuele stand ophalen
     */

    async function laadStand() {

        try {

            const response = await fetch(
                "standings.json?" + new Date().getTime()
            );

            if (!response.ok) {
                throw new Error(
                    "standings.json kon niet worden geladen."
                );
            }

            const data = await response.json();


            /*
             * Tijdstip van de laatste API-update
             */

            if (data.updatedAt) {

                const datum = new Date(data.updatedAt);

                const datumTekst = datum.toLocaleString(
                    "nl-NL",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

                document.getElementById(
                    "laatstBijgewerkt"
                ).textContent =
                    "Laatst bijgewerkt: " + datumTekst;

            }


            /*
             * De totale Eredivisie-stand pakken
             */

            const totalStand = data.standings.find(
                standing => standing.type === "TOTAL"
            );


            if (!totalStand) {
                throw new Error(
                    "Geen totale stand gevonden."
                );
            }


            /*
             * Alleen onze vijf clubs selecteren
             */

            const geselecteerdeClubs =
                totalStand.table

                .filter(team => {

                    const naam = team.team.name;

                    return Object.keys(clubs).some(
                        clubNaam =>
                            naam.includes(clubNaam)
                    );

                })

                .map(team => {

                    const naam = team.team.name;

                    const clubNaam =
                        Object.keys(clubs).find(
                            club =>
                                naam.includes(club)
                        );


                    const bonus =
                        clubs[clubNaam].bonus;


                    return {

                        naam:
                            clubs[clubNaam].naam,

                        klasse:
                            clubs[clubNaam].klasse,

                        logo:
                            team.team.crest,

                        gespeeld:
                            team.playedGames,

                        gewonnen:
                            team.won,

                        gelijk:
                            team.draw,

                        verloren:
                            team.lost,

                        voor:
                            team.goalsFor,

                        tegen:
                            team.goalsAgainst,

                        verschil:
                            team.goalsFor -
                            team.goalsAgainst,

                        originelePunten:
                            team.points,

                        bonus:
                            bonus,

                        punten:
                            team.points + bonus

                    };

                });


            /*
             * Sorteren op onze aangepaste punten
             */

            geselecteerdeClubs.sort(
                (a, b) => {

                    if (
                        b.punten !== a.punten
                    ) {
                        return (
                            b.punten -
                            a.punten
                        );
                    }

                    if (
                        b.verschil !==
                        a.verschil
                    ) {
                        return (
                            b.verschil -
                            a.verschil
                        );
                    }

                    return (
                        b.voor -
                        a.voor
                    );

                }
            );


            /*
             * Tabel leegmaken
             */

            const tabel =
                document.getElementById(
                    "stand"
                );

            tabel.innerHTML = "";


            /*
             * Clubs in de tabel plaatsen
             */

            geselecteerdeClubs.forEach(
                (club, index) => {

                    const rij =
                        document.createElement(
                            "tr"
                        );

                    rij.className =
                        club.klasse;


                    rij.innerHTML = `

                        <td>
                            ${index + 1}
                        </td>

                        <td>

                            <div class="club">

                                <img
                                    src="${club.logo}"
                                    alt="${club.naam}"
                                >

                                <span class="club-naam">
                                    ${club.naam}
                                </span>

                            </div>

                        </td>

                        <td>
                            ${club.gespeeld}
                        </td>

                        <td>
                            ${club.gewonnen}
                        </td>

                        <td>
                            ${club.gelijk}
                        </td>

                        <td>
                            ${club.verloren}
                        </td>

                        <td>
                            ${club.voor}
                        </td>

                        <td>
                            ${club.tegen}
                        </td>

                        <td class="punten">

                            ${club.punten}

                            ${
                                club.bonus > 0
                                ? `
                                    <span class="correctie">
                                        (+${club.bonus})
                                    </span>
                                  `
                                : ""
                            }

                        </td>

                    `;

                    tabel.appendChild(rij);

                }
            );


        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "stand"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="9"
                        class="fout"
                    >

                        Er ging iets mis
                        bij het ophalen
                        van de actuele stand.

                    </td>

                </tr>

            `;

        }

    }


    /*
     * Eerste keer laden
     */

    laadStand();


    /*
     * Iedere 5 minuten opnieuw controleren
     *
     * De GitHub Action werkt iedere 15 minuten
     * de gegevens daadwerkelijk bij.
     */

    setInterval(
        laadStand,
        5 * 60 * 1000
    );

</script>

</body>
</html>
